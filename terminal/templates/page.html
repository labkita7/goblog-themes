<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headPage" .}}
<body class="{{if setting "scanlines"}}scan{{end}}">
<a class="skip-link" href="#main">Skip to content</a>
<div class="term">
{{template "header" .}}
<main id="main">
  <article>
    <p class="cmd"><span class="ps">reader@<span class="host">{{setting "prompt_host"}}</span>:~$</span> <span class="cmd-arg">cat {{.Post.Slug}}.txt</span></p>
    <h1 class="post-title">{{.Post.Title}}</h1>
    <div class="prose term-prose">{{.Post.HTML}}</div>
  </article>
</main>
{{template "footer" .}}
</div>
</body>
</html>
