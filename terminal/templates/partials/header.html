{{define "header"}}
<header class="term-head">
  <p class="cmd"><span class="ps">reader@<span class="host">{{setting "prompt_host"}}</span>:~$</span> <a class="cmd-arg" href="/">cd ~</a></p>
  <div class="head-row">
    {{if .Nav.Items}}
    <nav aria-label="Main navigation">
      <ul class="nav">
        {{range .Nav.Items}}<li class="nav-item"><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
      </ul>
    </nav>
    {{end}}
    <button type="button" data-theme-toggle class="toggle" aria-label="Toggle dark mode"><span class="t-to-light">light</span><span class="t-to-dark">dark</span></button>
  </div>
  <div class="rule" aria-hidden="true"></div>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
