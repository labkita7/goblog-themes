<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body class="{{if setting "scanlines"}}scan{{end}}">
<a class="skip-link" href="#main">Skip to content</a>
<div class="term">
{{template "header" .}}
<main id="main">
  <section class="block">
    <p class="cmd"><span class="ps">reader@<span class="host">{{setting "prompt_host"}}</span>:~$</span> <span class="cmd-arg">cd ./requested-page</span></p>
    <h1 class="motd">error {{.Code}}</h1>
    <p class="out err" role="alert">bash: cd: {{.Message}}: No such file or directory</p>
    <p class="out"><a href="/">[ return to ~ ]</a></p>
  </section>
</main>
{{template "footer" .}}
</div>
</body>
</html>
