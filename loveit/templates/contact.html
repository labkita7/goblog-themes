<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
<title>{{.Head.Title}}</title>
<meta name="description" content="{{.Head.Description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{.Head.Title}}">
<meta property="og:description" content="{{.Head.Description}}">
</head>
<body class="lv-page">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="lv-main">
  <header class="lv-intro">
    <h1>Contact</h1>
    <p>Send a message to {{.Site.Title}}.</p>
  </header>
  {{if .Sent}}
  <p class="lv-notice" role="status">Thank you — your message was delivered.</p>
  {{else}}
  {{if .Message}}<p class="lv-notice is-error" role="alert">{{.Message}}</p>{{end}}
  <form class="lv-form" method="post" action="/contact">
    <label for="lv-name">Name
      <input id="lv-name" name="name" required maxlength="100" autocomplete="name" value="{{.Values.Name}}">
    </label>
    <label for="lv-email">Email
      <input id="lv-email" name="email" type="email" required maxlength="200" autocomplete="email" value="{{.Values.Email}}">
    </label>
    <label for="lv-subject">Subject
      <input id="lv-subject" name="subject" maxlength="150" value="{{.Values.Subject}}">
    </label>
    <label for="lv-message">Message
      <textarea id="lv-message" name="message" rows="6" required minlength="10" maxlength="5000">{{.Values.Message}}</textarea>
    </label>
    <label for="lv-captcha">{{.Question}}
      <small>Spam check</small>
      <input id="lv-captcha" name="captcha" required inputmode="numeric" autocomplete="off">
    </label>
    <input type="hidden" name="captcha_token" value="{{.Token}}">
    <div class="lv-hp" aria-hidden="true">
      <label>Website <input name="website" tabindex="-1" autocomplete="off"></label>
    </div>
    <button type="submit">Send message</button>
  </form>
  {{end}}
</main>
{{template "footer" .}}
</body>
</html>
