{{define "header"}}
<header class="lv-nav">
  <div class="lv-nav-inner">
    <a class="lv-brand" href="/">{{.Site.Title}}</a>
    {{if .Nav.Items}}
    <nav class="lv-links" aria-label="Main navigation">
      <ul>{{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}</ul>
    </nav>
    <details class="lv-menu">
      <summary>Menu</summary>
      <nav aria-label="Main navigation mobile">
        <ul>{{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}</ul>
      </nav>
    </details>
    {{end}}
    <button type="button" class="lv-switch" data-theme-toggle aria-label="Toggle dark mode"></button>
  </div>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
