<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body class="lv-page">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="lv-main lv-error">
  <p class="lv-error-code" aria-hidden="true">{{.Code}}</p>
  <h1>{{.Message}}</h1>
  <p>The page you are looking for does not exist or has moved.</p>
  <a class="lv-button" href="/">Back to the blog</a>
</main>
{{template "footer" .}}
</body>
</html>
