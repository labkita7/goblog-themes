<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="wrap error-page">
  <p class="error-code" aria-hidden="true">{{.Code}}</p>
  <h1>{{.Message}}</h1>
  <p>The page you were looking for has moved or never existed.</p>
  <a class="btn" href="/">Back to latest stories</a>
</main>
{{template "footer" .}}
</body>
</html>
