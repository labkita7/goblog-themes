<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headPage" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="bf-shell bf-post-wrap">
  <article class="bf-post-card">
    <h1>{{.Post.Title}}</h1>
    {{if .TOC}}
    <details class="bf-toc">
      <summary>Contents</summary>
      <ol>
        {{range .TOC}}<li class="bf-toc-{{.Level}}"><a href="#{{.ID}}">{{.Text}}</a></li>{{end}}
      </ol>
    </details>
    {{end}}
    <div class="prose bf-post-body">{{.Post.HTML}}</div>
  </article>
</main>
{{template "footer" .}}
</body>
</html>
