<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="bf-shell bf-404">
  <p class="bf-404-code" aria-hidden="true">{{.Code}}</p>
  <h1 class="bf-hero-title">{{.Message}}</h1>
  <p class="bf-card-excerpt">The page you requested is not here.</p>
  <p><a class="bf-btn bf-btn-fill" href="/">Go to the front page</a></p>
</main>
{{template "footer" .}}
</body>
</html>
