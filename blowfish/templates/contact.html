<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
<title>{{.Head.Title}}</title>
<meta name="description" content="{{.Head.Description}}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="bf-shell bf-tile">
  <section class="bf-banner">
    <h1>Contact</h1>
    <p>Send a message. Answer the spam check question to submit it.</p>
  </section>
  {{if .Sent}}
  <p class="bf-notice" role="status">Thanks. Your message was sent.</p>
  {{else}}
  {{if .Message}}<p class="bf-notice bf-notice-error" role="alert">{{.Message}}</p>{{end}}
  <form class="bf-form" method="post" action="/contact">
    <label class="bf-field"><span>Name</span><input name="name" required maxlength="100" autocomplete="name" value="{{.Values.Name}}"></label>
    <label class="bf-field"><span>Email</span><input name="email" type="email" required maxlength="200" autocomplete="email" value="{{.Values.Email}}"></label>
    <label class="bf-field"><span>Subject</span><input name="subject" maxlength="150" value="{{.Values.Subject}}"></label>
    <label class="bf-field"><span>Message</span><textarea name="message" rows="6" required minlength="10" maxlength="5000">{{.Values.Message}}</textarea></label>
    <label class="bf-field"><span>{{.Question}}</span><input name="captcha" required inputmode="numeric" autocomplete="off"></label>
    <input type="hidden" name="captcha_token" value="{{.Token}}">
    <div class="bf-honey" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
    <button class="bf-submit" type="submit">Send message</button>
  </form>
  {{end}}
</main>
{{template "footer" .}}
</body>
</html>
