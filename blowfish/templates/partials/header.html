{{define "header"}}
<header class="bf-header">
  <div class="bf-shell">
    <div class="bf-bar">
      <a class="bf-brand" href="/">
        <span class="bf-mark" aria-hidden="true">{{printf "%.1s" .Site.Title}}</span>
        <span class="bf-brand-text">{{.Site.Title}}</span>
      </a>
      {{if .Nav.Items}}
      <nav class="bf-nav" aria-label="Main navigation">
        <ul>
          {{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
        </ul>
      </nav>
      {{end}}
      <button type="button" class="bf-switch" data-theme-toggle aria-label="Toggle dark mode">
        <span class="bf-knob">
          <svg class="bf-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
          <svg class="bf-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </span>
      </button>
    </div>
  </div>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
