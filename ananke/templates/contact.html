<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
<title>{{.Head.Title}}</title>
<meta name="description" content="{{.Head.Description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{.Head.Title}}">
<meta property="og:description" content="{{.Head.Description}}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="contact">
  <header class="contact-head">
    <h1>Contact</h1>
    <p class="hero-lede">Send a note. Replies go to the address you enter.</p>
  </header>
  {{if .Sent}}
  <p class="notice" role="status">Thank you. Your message was delivered.</p>
  {{else}}
  {{if .Message}}<p class="notice notice--error" role="alert">{{.Message}}</p>{{end}}
  <form method="post" action="/contact" class="contact-form">
    <div class="field"><label for="c-name">Name</label><input id="c-name" name="name" required maxlength="100" value="{{.Values.Name}}"></div>
    <div class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" required maxlength="200" value="{{.Values.Email}}"></div>
    <div class="field"><label for="c-subject">Subject</label><input id="c-subject" name="subject" maxlength="150" value="{{.Values.Subject}}"></div>
    <div class="field"><label for="c-message">Message</label><textarea id="c-message" name="message" rows="6" required minlength="10" maxlength="5000">{{.Values.Message}}</textarea></div>
    <div class="field"><label for="c-captcha">{{.Question}} <span class="meta">(spam check)</span></label><input id="c-captcha" name="captcha" required inputmode="numeric" autocomplete="off"></div>
    <input type="hidden" name="captcha_token" value="{{.Token}}">
    <div class="hp" aria-hidden="true"><label>Leave this empty<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
    <button class="btn" type="submit">Send message</button>
  </form>
  {{end}}
</main>
{{template "footer" .}}
</body>
</html>
