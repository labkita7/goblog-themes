<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headPage" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main">
  <article class="post">
    <header class="post-hero post-hero--plain">
      <div class="post-hero-inner">
        <h1>{{.Post.Title}}</h1>
      </div>
    </header>
    <div class="prose post-body">{{.Post.HTML}}</div>
  </article>
</main>
{{template "footer" .}}
</body>
</html>
