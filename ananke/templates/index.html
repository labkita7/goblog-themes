<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headIndex" .}}
<body>
<a class="skip-link" href="#latest">Skip to the latest posts</a>
{{template "header" .}}
<section class="hero{{if eq (setting "hero_height") "compact"}} hero--compact{{end}}">
  <div class="hero-inner">
    <h1>{{.Site.Title}}</h1>
    {{if .Site.Description}}<p class="hero-lede">{{.Site.Description}}</p>{{end}}
    <a class="hero-cta" href="#latest">{{setting "hero_button"}}</a>
  </div>
</section>
<main id="main">
  <section class="latest" id="latest" aria-labelledby="latest-title">
    <h2 class="section-title" id="latest-title">Latest</h2>
    <div class="entries">
      {{range .Posts}}{{template "entry" .}}{{end}}
    </div>
    {{template "pagination" .}}
  </section>
</main>
{{template "footer" .}}
</body>
</html>
