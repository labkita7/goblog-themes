{{define "footer"}}
<footer class="site-footer">
  <div class="site-footer-inner">
    <p class="site-footer-title">{{.Site.Title}}</p>
    {{if .FooterNav.Items}}
    <nav aria-label="Footer navigation">
      <ul class="footer-nav">
        {{range .FooterNav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
      </ul>
    </nav>
    {{end}}
    <p class="footer-meta">© {{.Site.Year}} · <a href="/rss.xml">RSS</a> · <a href="/atom.xml">Atom</a> · <a href="/feed.json">JSON</a></p>
  </div>
</footer>
{{end}}
