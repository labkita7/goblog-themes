{{define "pagination"}}
{{if or .PrevURL .NextURL}}
<nav class="pager" aria-label="Pagination">
  {{if .PrevURL}}<a href="{{.PrevURL}}" rel="prev">← Newer</a>{{else}}<span class="pager-off">← Newer</span>{{end}}
  {{if .NextURL}}<a href="{{.NextURL}}" rel="next">Older →</a>{{else}}<span class="pager-off">Older →</span>{{end}}
</nav>
{{end}}
{{end}}
