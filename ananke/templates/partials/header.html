{{define "header"}}
<header class="top">
  <a class="brand" href="/">{{.Site.Title}}</a>
  <nav aria-label="Main navigation" class="top-nav">
    {{if .Nav.Items}}
    <ul>
      {{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
    </ul>
    {{end}}
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </nav>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
