<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main">
  <section class="hero hero--compact">
    <div class="hero-inner">
      <p class="hero-code" aria-hidden="true">{{.Code}}</p>
      <h1>{{.Message}}</h1>
      <p class="hero-lede">The page you are looking for does not exist or has moved.</p>
      <a class="hero-cta" href="/">Back to the front page</a>
    </div>
  </section>
</main>
{{template "footer" .}}
</body>
</html>
