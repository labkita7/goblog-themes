<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headTag" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main">
  <header class="post-hero post-hero--plain">
    <div class="post-hero-inner">
      <p class="meta-line">Tag</p>
      <h1>{{.Tag.Name}}</h1>
      <p class="byline">{{len .Posts}} post{{if ne (len .Posts) 1}}s{{end}}</p>
    </div>
  </header>
  <section class="latest" aria-label="Posts with this tag">
    <div class="entries">
      {{range .Posts}}{{template "entry" .}}{{end}}
    </div>
    {{template "pagination" .}}
  </section>
</main>
{{template "footer" .}}
</body>
</html>
