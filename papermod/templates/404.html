<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body class="pm">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="pm-wrap pm-main">
  <p class="pm-error-code" aria-hidden="true">{{.Code}}</p>
  <h1 class="pm-page-title">{{.Message}}</h1>
  <p class="pm-lead">The page you are looking for does not exist or has moved.</p>
  <a class="pm-button" href="/">← Back to the blog</a>
</main>
{{template "footer" .}}
</body>
</html>
