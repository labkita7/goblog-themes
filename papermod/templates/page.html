<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headPage" .}}
<body class="pm">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="pm-wrap pm-main">
  <article>
    <h1 class="pm-post-title">{{.Post.Title}}</h1>
    {{if and (setting "show_toc") .TOC}}
    <details class="pm-toc" open>
      <summary>Table of contents</summary>
      <ol>
        {{range .TOC}}<li class="lvl-{{.Level}}"><a href="#{{.ID}}">{{.Text}}</a></li>{{end}}
      </ol>
    </details>
    {{end}}
    <div class="prose pm-article">{{.Post.HTML}}</div>
  </article>
</main>
{{template "footer" .}}
</body>
</html>
