<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
<title>{{.Head.Title}}</title>
<meta name="description" content="{{.Head.Description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{.Head.Title}}">
<meta property="og:description" content="{{.Head.Description}}">
</head>
<body class="pm">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="pm-wrap pm-main">
  <h1 class="pm-page-title">Contact</h1>
  <p class="pm-lead">Write to {{.Site.Title}}. Messages go straight to the author.</p>
  {{if .Sent}}
  <p class="pm-notice" role="status">Thank you — your message was delivered.</p>
  {{else}}
  {{if .Message}}<p class="pm-notice is-error" role="alert">{{.Message}}</p>{{end}}
  <form class="pm-form" method="post" action="/contact">
    <label for="pm-name">Name
      <input id="pm-name" name="name" required maxlength="100" autocomplete="name" value="{{.Values.Name}}">
    </label>
    <label for="pm-email">Email
      <input id="pm-email" name="email" type="email" required maxlength="200" autocomplete="email" value="{{.Values.Email}}">
    </label>
    <label for="pm-subject">Subject
      <input id="pm-subject" name="subject" maxlength="150" value="{{.Values.Subject}}">
    </label>
    <label for="pm-message">Message
      <textarea id="pm-message" name="message" rows="6" required minlength="10" maxlength="5000">{{.Values.Message}}</textarea>
    </label>
    <label for="pm-captcha">{{.Question}}
      <span class="pm-hint">Answer to prove you are human</span>
      <input id="pm-captcha" name="captcha" required inputmode="numeric" autocomplete="off">
    </label>
    <input type="hidden" name="captcha_token" value="{{.Token}}">
    <div class="pm-hp" aria-hidden="true">
      <label>Website <input name="website" tabindex="-1" autocomplete="off"></label>
    </div>
    <button type="submit">Send message</button>
  </form>
  {{end}}
</main>
{{template "footer" .}}
</body>
</html>
