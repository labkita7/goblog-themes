{{define "header"}}
<header class="pm-header">
  <input class="pm-burger-toggle" type="checkbox" id="pm-nav-toggle" aria-label="Show main menu">
  <div class="pm-wrap pm-header-bar">
    <a class="pm-brand" href="/">{{.Site.Title}}</a>
    <div class="pm-menu">
      <label class="pm-burger" for="pm-nav-toggle" aria-hidden="true"><span></span></label>
      {{if .Nav.Items}}
      <nav class="pm-nav-wrap" aria-label="Main navigation">
        <ul>{{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}</ul>
      </nav>
      {{end}}
      <button type="button" class="pm-theme" data-theme-toggle aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg></button>
    </div>
  </div>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
