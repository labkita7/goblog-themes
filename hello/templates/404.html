<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body class="hl{{if eq (setting "title_style") "lowercase"}} hl-lower{{end}}">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="hl-main hl-404">
  <p class="hl-code">{{.Code}}</p>
  <h1>{{.Message}}</h1>
  <p>Nothing lives at this address. Try the <a href="/">latest posts</a>.</p>
</main>
{{template "footer" .}}
</body>
</html>
