{{define "footer"}}
<footer class="hl-footer">
  <p>© {{.Site.Year}} {{.Site.Title}}</p>
  {{if .FooterNav.Items}}
  <nav aria-label="Footer navigation">
    <ul>{{range .FooterNav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}</ul>
  </nav>
  {{end}}
  <p class="hl-feeds"><a href="/rss.xml">rss</a> <a href="/atom.xml">atom</a> <a href="/feed.json">json</a></p>
</footer>
{{end}}
