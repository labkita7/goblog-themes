{{define "header"}}
<header class="hl-header">
  <a class="hl-logo" href="/">
    <span class="hl-mark" aria-hidden="true">&gt;</span>
    <span class="hl-title">{{.Site.Title}}</span>
  </a>
  <nav class="hl-nav" aria-label="Main navigation">
    <ul>
      {{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
      <li>
        <button type="button" class="hl-toggle" data-theme-toggle aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </li>
    </ul>
  </nav>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
