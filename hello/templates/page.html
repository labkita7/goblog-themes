<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headPage" .}}
<body class="hl{{if eq (setting "title_style") "lowercase"}} hl-lower{{end}}">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="hl-main">
  <article>
    <header class="hl-post-head">
      <h1>{{.Post.Title}}</h1>
    </header>
    <div class="prose">{{.Post.HTML}}</div>
  </article>
</main>
{{template "footer" .}}
</body>
</html>
