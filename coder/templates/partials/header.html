{{define "header"}}
<header class="site-header">
  <a class="brand" href="/">
    {{if .Site.Title}}<span class="badge" aria-hidden="true">{{printf "%.1s" .Site.Title}}</span>{{end}}
    <span class="brand-name">{{.Site.Title}}</span>
  </a>
  <div class="nav-row">
    {{if .Nav.Items}}
    <nav aria-label="Main navigation">
      <ul class="nav-list">
        {{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
      </ul>
    </nav>
    {{end}}
    <button type="button" data-theme-toggle class="theme-toggle" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
