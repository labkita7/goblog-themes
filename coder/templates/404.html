<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="wrap error-page">
  <p class="error-code" aria-hidden="true">{{.Code}}</p>
  <h1 class="post-title">{{.Message}}</h1>
  <p class="lede">The page you were looking for has moved, or it never existed.</p>
  <p><a class="btn" href="/">Back to the homepage</a></p>
</main>
{{template "footer" .}}
</body>
</html>
