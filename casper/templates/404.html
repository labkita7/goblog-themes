<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="cover cover--short">
  {{template "header" .}}
  <main id="main" class="cover-inner">
    <p class="cover-code" aria-hidden="true">{{.Code}}</p>
    <h1 class="cover-title">{{.Message}}</h1>
    <p class="cover-desc">Nothing lives at this address anymore.</p>
    <p><a class="cta" href="/">Go to the front page</a></p>
  </main>
</div>
{{template "footer" .}}
</body>
</html>
