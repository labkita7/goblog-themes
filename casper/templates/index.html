<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headIndex" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="cover cover--{{setting "cover_height"}}">
  {{template "header" .}}
  <div class="cover-inner">
    <h1 class="cover-title">{{.Site.Title}}</h1>
    {{if .Site.Description}}<p class="cover-desc">{{.Site.Description}}</p>{{end}}
  </div>
</div>
<main id="main" class="grid-wrap">
  <div class="card-grid">
    {{range .Posts}}{{template "card" .}}{{end}}
  </div>
  {{template "pills" .}}
</main>
{{template "footer" .}}
</body>
</html>
