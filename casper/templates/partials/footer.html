{{define "footer"}}
<footer class="site-foot">
  <div class="site-foot-inner">
    <p class="site-foot-title">{{.Site.Title}}</p>
    {{if .FooterNav.Items}}
    <nav aria-label="Footer navigation">
      <ul class="site-foot-menu">
        {{range .FooterNav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
      </ul>
    </nav>
    {{end}}
    <p class="site-foot-feeds">© {{.Site.Year}} <span aria-hidden="true">·</span> <a href="/rss.xml">RSS</a> <span aria-hidden="true">·</span> <a href="/atom.xml">Atom</a> <span aria-hidden="true">·</span> <a href="/feed.json">JSON</a></p>
  </div>
</footer>
{{end}}
