{{define "card"}}
<article class="card">
  <a class="card-media" href="{{.URL}}" tabindex="-1" aria-hidden="true">
    {{if .CoverURL}}<img src="{{.CoverURL}}" alt="" loading="lazy" width="800" height="600">{{else}}<span class="card-fallback"></span>{{end}}
  </a>
  <div class="card-body">
    {{if .Tags}}<p class="card-kicker">{{(index .Tags 0).Name}}</p>{{end}}
    <h2 class="card-title"><a href="{{.URL}}">{{.Title}}</a></h2>
    {{if and .Excerpt (setting "show_excerpt")}}<p class="card-excerpt">{{.Excerpt}}</p>{{end}}
    <p class="card-meta"><time datetime="{{isoDate .PublishedAt}}">{{formatDate .PublishedAt}}</time>{{if setting "show_reading_time"}} <span aria-hidden="true">·</span> {{.ReadingMinutes}} min read{{end}}</p>
  </div>
</article>
{{end}}
