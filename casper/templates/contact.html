<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
<title>{{.Head.Title}}</title>
<meta name="description" content="{{.Head.Description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{.Head.Title}}">
<meta property="og:description" content="{{.Head.Description}}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="cover cover--short">
  {{template "header" .}}
  <div class="cover-inner">
    <h1 class="cover-title">Contact</h1>
    <p class="cover-desc">Questions, corrections, or hello.</p>
  </div>
</div>
<main id="main" class="article">
  {{if .Sent}}
  <p class="notice" role="status">Thanks. Your message is on its way.</p>
  {{else}}
  {{if .Message}}<p class="notice notice--error" role="alert">{{.Message}}</p>{{end}}
  <form method="post" action="/contact" class="form">
    <p class="field"><label for="c-name">Name</label><input id="c-name" name="name" required maxlength="100" value="{{.Values.Name}}"></p>
    <p class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" required maxlength="200" value="{{.Values.Email}}"></p>
    <p class="field"><label for="c-subject">Subject</label><input id="c-subject" name="subject" maxlength="150" value="{{.Values.Subject}}"></p>
    <p class="field"><label for="c-message">Message</label><textarea id="c-message" name="message" rows="7" required minlength="10" maxlength="5000">{{.Values.Message}}</textarea></p>
    <p class="field"><label for="c-captcha">{{.Question}} <span class="field-hint">(spam check)</span></label><input id="c-captcha" name="captcha" required inputmode="numeric" autocomplete="off"></p>
    <input type="hidden" name="captcha_token" value="{{.Token}}">
    <div class="hp" aria-hidden="true"><label>Leave this empty<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
    <p><button class="cta" type="submit">Send message</button></p>
  </form>
  {{end}}
</main>
{{template "footer" .}}
</body>
</html>
