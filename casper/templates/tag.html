<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headTag" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="cover cover--short">
  {{template "header" .}}
  <div class="cover-inner">
    <p class="card-kicker">Tag</p>
    <h1 class="cover-title">{{.Tag.Name}}</h1>
    <p class="cover-desc">{{len .Posts}} post{{if ne (len .Posts) 1}}s{{end}}</p>
  </div>
</div>
<main id="main" class="grid-wrap">
  <div class="card-grid">
    {{range .Posts}}{{template "card" .}}{{end}}
  </div>
  {{template "pills" .}}
</main>
{{template "footer" .}}
</body>
</html>
