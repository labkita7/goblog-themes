<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="story story--missing">
  <p class="missing-code" aria-hidden="true">{{.Code}}</p>
  <h1>{{.Message}}</h1>
  <p class="band-lede">The frame is empty. The photograph you wanted was moved or never printed.</p>
  <p><a class="turn-label" href="/">Back to the first print ›</a></p>
</main>
{{template "footer" .}}
</body>
</html>
