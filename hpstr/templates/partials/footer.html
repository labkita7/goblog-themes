{{define "footer"}}
<footer class="colophon">
  <p class="colophon-title">{{.Site.Title}}</p>
  {{if .FooterNav.Items}}
  <nav aria-label="Footer navigation">
    <ul class="colophon-nav">
      {{range .FooterNav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
    </ul>
  </nav>
  {{end}}
  <p class="colophon-feeds">{{.Site.Year}} · <a href="/rss.xml">RSS</a> · <a href="/atom.xml">Atom</a> · <a href="/feed.json">JSON</a></p>
</footer>
{{end}}
