<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headIndex" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<section class="title-band">
  <h1>{{.Site.Title}}</h1>
  {{if .Site.Description}}<p class="band-lede">{{.Site.Description}}</p>{{end}}
</section>
<main id="main" class="rows">
  {{range .Posts}}{{template "row" .}}{{end}}
  {{template "pager" .}}
</main>
{{template "footer" .}}
</body>
</html>
