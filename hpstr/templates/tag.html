<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headTag" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<section class="title-band">
  <p class="kicker-line">Tag</p>
  <h1>{{.Tag.Name}}</h1>
  <p class="band-lede">{{len .Posts}} post{{if ne (len .Posts) 1}}s{{end}}</p>
</section>
<main id="main" class="rows">
  {{range .Posts}}{{template "row" .}}{{end}}
  {{template "pager" .}}
</main>
{{template "footer" .}}
</body>
</html>
