<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="ad-shell ad-404">
  <p class="ad-404-code" aria-hidden="true">{{.Code}}</p>
  <h1 class="ad-404-title">{{.Message}}</h1>
  <p class="ad-page-lede">The page you are looking for does not exist or has moved.</p>
  <p class="ad-actions"><a class="ad-btn" href="/">Back to the writing</a></p>
</main>
{{template "footer" .}}
</body>
</html>
