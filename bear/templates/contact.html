<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
<title>{{.Head.Title}} · {{.Site.Title}}</title>
<meta name="description" content="{{.Head.Description}}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="wrap">
  <h1>Contact</h1>
  {{if .Sent}}
  <p role="status">Thanks, your message was sent.</p>
  {{else}}
  {{if .Message}}<p class="error" role="alert">{{.Message}}</p>{{end}}
  <form method="post" action="/contact" class="form">
    <label>Name <input name="name" required maxlength="100" value="{{.Values.Name}}"></label>
    <label>Email <input name="email" type="email" required maxlength="200" value="{{.Values.Email}}"></label>
    <label>Subject <input name="subject" maxlength="150" value="{{.Values.Subject}}"></label>
    <label>Message <textarea name="message" rows="7" required minlength="10" maxlength="5000">{{.Values.Message}}</textarea></label>
    <label>{{.Question}} <input name="captcha" required inputmode="numeric" autocomplete="off"></label>
    <input type="hidden" name="captcha_token" value="{{.Token}}">
    <input class="honeypot" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p><button type="submit">Send</button></p>
  </form>
  {{end}}
</main>
{{template "footer" .}}
</body>
</html>
