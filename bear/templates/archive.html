<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headArchive" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="wrap">
  <h1>{{if .Year}}{{.Year}}{{else}}Archive{{end}}</h1>
  <p class="years">{{range .Site.ArchiveYears}}<a href="{{.URL}}">{{.Year}}</a> ({{.Count}}) {{end}}</p>
  {{template "list" .}}
  {{template "pager" .}}
</main>
{{template "footer" .}}
</body>
</html>
