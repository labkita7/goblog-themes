{{define "header"}}
<header class="top">
  <nav class="top-line" aria-label="Main navigation">
    <a class="site" href="/">{{.Site.Title}}</a>
    {{range .Nav.Items}}<a href="{{.URL}}">{{.Label}}</a>{{end}}
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode"><span class="on-light">Dark</span><span class="on-dark">Light</span></button>
  </nav>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
