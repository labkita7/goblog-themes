{{define "header"}}
<header class="la-hdr">
  <div class="la-hdr-inner">
    <a class="la-hdr-brand" href="/">{{.Site.Title}}</a>
    <div class="la-hdr-right">
      {{if .Nav.Items}}
      <nav aria-label="Main navigation" class="la-hdr-nav">
        {{range .Nav.Items}}<a href="{{.URL}}">{{.Label}}</a>{{end}}
      </nav>
      {{end}}
      
      <button type="button" data-theme-toggle aria-label="Toggle dark mode" class="la-hdr-toggle">◐</button>
    </div>
  </div>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
