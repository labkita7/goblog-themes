{{define "footer"}}
<footer class="la-ftr">
  <div class="la-ftr-inner">
    <p>© {{.Site.Year}} {{.Site.Title}}</p>
    {{if .FooterNav.Items}}
    <nav aria-label="Footer"><ul>{{range .FooterNav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}</ul></nav>
    {{end}}
    <ul class="la-ftr-feeds">
      <li><a href="/rss.xml">RSS</a></li>
      <li><a href="/atom.xml">Atom</a></li>
      <li><a href="/feed.json">JSON</a></li>
    </ul>
  </div>
</footer>
{{end}}
