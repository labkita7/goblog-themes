{{define "header"}}
<header class="dy-cover">
  <a class="dy-brand" href="/">{{.Site.Title}}</a>
  <p class="dy-sub">{{.Site.Description}}</p>
  <div class="dy-bar">
    <nav aria-label="Main navigation">
      <ul class="dy-nav">
        {{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
      </ul>
    </nav>
    <button type="button" class="dy-toggle" data-theme-toggle aria-label="Toggle dark mode">
      <span aria-hidden="true">✦</span>
    </button>
  </div>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
