{{define "footer"}}
<footer class="dy-footer">
  <p>Written with care, © {{.Site.Year}} {{.Site.Title}}</p>
  {{if .FooterNav.Items}}
  <nav aria-label="Footer navigation">
    <ul class="dy-nav">{{range .FooterNav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}</ul>
  </nav>
  {{end}}
  <p class="dy-feeds"><a href="/rss.xml">rss</a> · <a href="/atom.xml">atom</a> · <a href="/feed.json">json</a></p>
</footer>
{{end}}
