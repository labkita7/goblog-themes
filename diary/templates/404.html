<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body class="dy">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="dy-main dy-404">
  <div class="dy-tile dy-tile-404" aria-hidden="true">
    <span class="dy-month">missing</span>
    <span class="dy-day">{{.Code}}</span>
    <span class="dy-year">page</span>
  </div>
  <h1 class="dy-h1">This page fell out of the notebook</h1>
  <p class="dy-meta">{{.Message}}. Nothing was written here, or it was moved.</p>
  <p><a class="dy-link" href="/">Back to the latest entries</a></p>
</main>
{{template "footer" .}}
</body>
</html>
