<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headPage" .}}
<body class="dy">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="dy-main">
  <article class="dy-page dy-page-post">
    <header class="dy-post-head dy-post-head-plain">
      <div>
        <p class="dy-kicker">a page</p>
        <h1>{{.Post.Title}}</h1>
      </div>
    </header>
    <div class="prose dy-prose">{{.Post.HTML}}</div>
  </article>
</main>
{{template "footer" .}}
</body>
</html>
