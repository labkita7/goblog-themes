<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
<title>{{.Head.Title}}</title>
<meta name="description" content="{{.Head.Description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{.Head.Title}}">
<meta property="og:description" content="{{.Head.Description}}">
</head>
<body class="gb">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="gb-main">
  <section class="gb-buffer-head">
    <p class="gb-path">:write contact.txt</p>
    <h1>Contact</h1>
  </section>
  <div class="gb-buffer">
  {{if .Sent}}
  <p class="contact-status" role="status">Thank you. Your message was delivered.</p>
  {{else}}
  {{if .Message}}<p class="contact-status is-error" role="alert">{{.Message}}</p>{{end}}
  <form method="post" action="/contact" class="contact-form">
    <label for="c-name">Name
      <input id="c-name" name="name" required maxlength="100" value="{{.Values.Name}}" autocomplete="name">
    </label>
    <label for="c-email">Email
      <input id="c-email" name="email" type="email" required maxlength="200" value="{{.Values.Email}}" autocomplete="email">
    </label>
    <label for="c-subject">Subject
      <input id="c-subject" name="subject" maxlength="150" value="{{.Values.Subject}}">
    </label>
    <label for="c-message">Message
      <textarea id="c-message" name="message" rows="6" required minlength="10" maxlength="5000">{{.Values.Message}}</textarea>
    </label>
    <label for="c-captcha">{{.Question}} <span class="hint">(spam check)</span>
      <input id="c-captcha" name="captcha" required inputmode="numeric" autocomplete="off">
    </label>
    <input type="hidden" name="captcha_token" value="{{.Token}}">
    <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="contact-submit" type="submit">Send message</button>
  </form>
  {{end}}
  </div>
</main>
{{template "footer" .}}
</body>
</html>
