{{define "footer"}}
<footer class="gb-status">
  <span class="gb-status-mode">{{.Site.Title}}</span>
  <span>© {{.Site.Year}}</span>
  {{if .FooterNav.Items}}
  <nav aria-label="Footer navigation">
    <ul>{{range .FooterNav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}</ul>
  </nav>
  {{end}}
  <span class="gb-status-feeds"><a href="/rss.xml">rss</a> <a href="/atom.xml">atom</a> <a href="/feed.json">json</a></span>
</footer>
{{end}}
