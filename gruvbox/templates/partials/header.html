{{define "header"}}
<header class="gb-topbar">
  <div class="gb-mode" aria-hidden="true">NORMAL</div>
  <a class="gb-brand" href="/">{{.Site.Title}}</a>
  <nav class="gb-tabs" aria-label="Main navigation">
    <ul>
      {{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
    </ul>
  </nav>
  <button type="button" class="gb-toggle" data-theme-toggle aria-label="Toggle dark mode">
    <span class="gb-on-light">:set bg=dark</span>
    <span class="gb-on-dark">:set bg=light</span>
  </button>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
