<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body class="gb">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="gb-main gb-error">
  <div class="gb-buffer">
    <p class="gb-path">E{{.Code}}: no such file</p>
    <h1>{{.Message}}</h1>
    <p>The path you asked for is not in this buffer. <a href="/">Return to the index</a>.</p>
  </div>
</main>
{{template "footer" .}}
</body>
</html>
