<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headPage" .}}
<body class="gb">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="gb-main">
  <article class="gb-buffer">
    <header class="gb-file">
      <p class="gb-path">{{.Post.Slug}}.md</p>
      <h1>{{.Post.Title}}</h1>
    </header>
    <div class="prose gb-prose">{{.Post.HTML}}</div>
  </article>
</main>
{{template "footer" .}}
</body>
</html>
