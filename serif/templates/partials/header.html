{{define "header"}}
{{/* Editorial masthead: rules above and below the centered serif title. */}}
<header class="border-b-2 border-foreground">
  <div class="mx-auto w-full max-w-6xl px-6 pb-5 pt-10">
    <div class="flex items-center justify-between gap-4 border-b border-border pb-3 text-sm text-muted-foreground">
      {{if .Nav.Items}}
      <nav aria-label="Main navigation">
        <ul class="flex items-center gap-4">
          {{range .Nav.Items}}<li><a class="kicker text-base hover:text-foreground" href="{{.URL}}">{{.Label}}</a></li>{{end}}
        </ul>
      </nav>
      {{else}}<span class="kicker text-base">{{.Site.Title}}</span>{{end}}
      <button type="button" data-theme-toggle aria-label="Toggle dark mode" class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-border text-muted-foreground transition-colors hover:text-foreground">◐</button>
    </div>
    <a href="/" class="mt-6 block text-center font-heading text-5xl font-bold leading-none tracking-tight hover:text-primary sm:text-6xl">{{.Site.Title}}</a>
    <p class="mt-3 text-center text-sm italic text-muted-foreground">{{.Site.Description}}</p>
  </div>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
