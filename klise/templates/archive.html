<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headArchive" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="wrap">
  <section class="hero hero-small">
    <p class="greet">Archive</p>
    <h1 class="hero-title">{{if .Year}}{{.Year}}{{else}}Everything{{end}}</h1>
    <nav class="year-nav" aria-label="Filter by year">
      <a class="pill{{if not .Year}} is-current{{end}}" href="/archive/"{{if not .Year}} aria-current="page"{{end}}>All</a>
      {{range .Site.ArchiveYears}}<a class="pill{{if eq .Year $.Year}} is-current{{end}}" href="{{.URL}}"{{if eq .Year $.Year}} aria-current="page"{{end}}>{{.Year}} · {{.Count}}</a>{{end}}
    </nav>
  </section>
  {{template "years" .}}
  {{template "pager" .}}
</main>
{{template "footer" .}}
</body>
</html>
