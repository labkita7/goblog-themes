<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headIndex" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="wrap">
  <section class="hero" aria-labelledby="site-title">
    <p class="greet">{{setting "greeting"}}</p>
    <h1 id="site-title" class="hero-title">{{.Site.Title}}</h1>
    <p class="hero-desc">{{.Site.Description}}</p>
  </section>
  {{template "years" .}}
  {{template "pager" .}}
</main>
{{template "footer" .}}
</body>
</html>
