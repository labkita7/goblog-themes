{{define "pager"}}
{{if or .PrevURL .NextURL}}
<nav class="pager" aria-label="Pagination">
  {{if .PrevURL}}<a class="pill" href="{{.PrevURL}}" rel="prev">← Newer posts</a>{{end}}
  {{if .NextURL}}<a class="pill pill-strong" href="{{.NextURL}}" rel="next">Older posts →</a>{{end}}
</nav>
{{end}}
{{end}}
