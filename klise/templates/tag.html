<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headTag" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="wrap">
  <section class="hero hero-small">
    <p class="greet">Tagged</p>
    <h1 class="hero-title">{{.Tag.Name}}</h1>
    <p class="hero-desc">{{len .Posts}} {{if eq (len .Posts) 1}}post{{else}}posts{{end}} with this tag.</p>
  </section>
  {{template "years" .}}
  {{template "pager" .}}
</main>
{{template "footer" .}}
</body>
</html>
