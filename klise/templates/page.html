<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headPage" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="wrap">
  <article class="story">
    <header class="story-head">
      <h1 class="story-title">{{.Post.Title}}</h1>
    </header>
    <div class="prose story-body">{{.Post.HTML}}</div>
  </article>
</main>
{{template "footer" .}}
</body>
</html>
