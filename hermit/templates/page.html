<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headPage" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="page">
{{template "header" .}}
<main id="main">
  <article>
    <header class="post-head">
      <h1 class="post-title">{{.Post.Title}}</h1>
    </header>
    <div class="prose hermit-prose">{{.Post.HTML}}</div>
  </article>
</main>
{{template "footer" .}}
</div>
</body>
</html>
