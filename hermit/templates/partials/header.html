{{define "header"}}
<header class="masthead">
  <a class="title" href="/">{{.Site.Title}}</a>
  {{template "masthead-tools" .}}
</header>
{{end}}

{{define "header-home"}}
<header class="masthead">
  <h1 class="masthead-heading"><a class="title" href="/">{{.Site.Title}}</a></h1>
  {{template "masthead-tools" .}}
</header>
{{end}}

{{define "masthead-tools"}}
  <div class="masthead-row">
    {{if .Nav.Items}}
    <nav aria-label="Main navigation">
      <ul class="nav">
        {{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
      </ul>
    </nav>
    {{end}}
    <button type="button" data-theme-toggle class="moon" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M14.6 3.2a9 9 0 1 0 6.2 12.5A7.6 7.6 0 0 1 14.6 3.2z"/></svg>
    </button>
  </div>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
