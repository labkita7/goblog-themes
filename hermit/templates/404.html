<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="page">
{{template "header" .}}
<main id="main">
  <header class="post-head">
    <p class="kicker">{{.Code}}</p>
    <h1 class="post-title">{{.Message}}</h1>
  </header>
  <p class="intro">Nothing lives at this address. The path may have moved, or it was never here.</p>
  <p class="back"><a href="/">Return to the start</a></p>
</main>
{{template "footer" .}}
</div>
</body>
</html>
