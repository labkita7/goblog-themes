<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headPage" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="lg-column lg-article">
  <article>
    <header>
      <h1 class="lg-article-title">{{.Post.Title}}</h1>
    </header>
    {{if .TOC}}
    <nav class="lg-toc" aria-labelledby="toc-title">
      <h2 id="toc-title">Contents</h2>
      <ol>
        {{range .TOC}}<li class="lg-toc-{{.Level}}"><a href="#{{.ID}}">{{.Text}}</a></li>{{end}}
      </ol>
    </nav>
    {{end}}
    <div class="prose lg-body">{{.Post.HTML}}</div>
  </article>
</main>
{{template "footer" .}}
</body>
</html>
