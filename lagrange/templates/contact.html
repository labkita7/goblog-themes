<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
<title>{{.Head.Title}}</title>
<meta name="description" content="{{.Head.Description}}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="lg-column">
  <header class="lg-head">
    <p class="lg-kicker lg-smallcaps">Correspondence</p>
    <h1 class="lg-head-title">Contact</h1>
  </header>
  {{if .Sent}}
  <p class="lg-notice" role="status">Thank you. Your message has been sent.</p>
  {{else}}
  {{if .Message}}<p class="lg-notice lg-notice-error" role="alert">{{.Message}}</p>{{end}}
  <form class="lg-form" method="post" action="/contact">
    <label class="lg-field"><span>Name</span><input name="name" required maxlength="100" autocomplete="name" value="{{.Values.Name}}"></label>
    <label class="lg-field"><span>Email</span><input name="email" type="email" required maxlength="200" autocomplete="email" value="{{.Values.Email}}"></label>
    <label class="lg-field"><span>Subject</span><input name="subject" maxlength="150" value="{{.Values.Subject}}"></label>
    <label class="lg-field"><span>Message</span><textarea name="message" rows="6" required minlength="10" maxlength="5000">{{.Values.Message}}</textarea></label>
    <label class="lg-field"><span>{{.Question}}</span><input name="captcha" required inputmode="numeric" autocomplete="off"></label>
    <input type="hidden" name="captcha_token" value="{{.Token}}">
    <div class="lg-honey" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
    <button class="lg-submit" type="submit">Send the message</button>
  </form>
  {{end}}
</main>
{{template "footer" .}}
</body>
</html>
