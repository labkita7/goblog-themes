{{define "header"}}
<header class="lg-header">
  <div class="lg-shell lg-bar">
    <a class="lg-brand" href="/">{{.Site.Title}}</a>
    <div class="lg-right">
      {{if .Nav.Items}}
      <nav aria-label="Main navigation">
        <ul class="lg-nav">
          {{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
        </ul>
      </nav>
      {{end}}
      <button type="button" class="lg-theme" data-theme-toggle aria-label="Toggle dark mode"><span class="lg-night">Night</span><span class="lg-day">Day</span></button>
    </div>
  </div>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
