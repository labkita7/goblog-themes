<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="lg-column lg-404">
  <p class="lg-404-code" aria-hidden="true">{{.Code}}</p>
  <h1 class="lg-404-title">{{.Message}}</h1>
  <p class="lg-excerpt">The page you are looking for does not exist or has moved.</p>
  <p><a class="lg-readmore" href="/">Return to the front page</a></p>
</main>
{{template "footer" .}}
</body>
</html>
