{{define "footer"}}
<footer class="foot">
  <ul class="foot-links">
    {{range .FooterNav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
    <li><a href="/rss.xml">RSS</a></li>
    <li><a href="/atom.xml">Atom</a></li>
    <li><a href="/feed.json">JSON</a></li>
  </ul>
  <p class="foot-copy">{{.Site.Title}} · © {{.Site.Year}}</p>
</footer>
{{end}}
