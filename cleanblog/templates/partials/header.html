{{define "header"}}
<header class="bar">
  <div class="bar-inner">
    <a class="bar-brand" href="/">{{.Site.Title}}</a>
    <nav aria-label="Main navigation">
      <ul class="bar-nav">
        {{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
      </ul>
    </nav>
    <button type="button" class="theme-switch" data-theme-toggle aria-label="Toggle dark mode">
      <span class="when-light">Dark mode</span><span class="when-dark">Light mode</span>
    </button>
  </div>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
