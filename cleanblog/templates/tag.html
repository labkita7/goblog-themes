<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headTag" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="masthead masthead--medium">
  {{template "header" .}}
  <header class="masthead-title">
    <p class="kicker">Tag</p>
    <h1>{{.Tag.Name}}</h1>
    <p class="masthead-sub">{{len .Posts}} post{{if ne (len .Posts) 1}}s{{end}}</p>
  </header>
</div>
<main id="main" class="column">
  {{range .Posts}}{{template "preview" .}}{{end}}
  {{template "pager" .}}
</main>
{{template "footer" .}}
</body>
</html>
