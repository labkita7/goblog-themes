<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headIndex" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="masthead{{if eq (setting "header_height") "medium"}} masthead--medium{{end}}">
  {{template "header" .}}
  <div class="masthead-title">
    <h1>{{.Site.Title}}</h1>
    {{if .Site.Description}}<p class="masthead-sub">{{.Site.Description}}</p>{{end}}
  </div>
</div>
<main id="main" class="column">
  {{range .Posts}}{{template "preview" .}}{{end}}
  {{template "pager" .}}
</main>
{{template "footer" .}}
</body>
</html>
