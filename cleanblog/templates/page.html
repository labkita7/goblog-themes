<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headPage" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="masthead masthead--medium">
  {{template "header" .}}
  <header class="masthead-title">
    <h1>{{.Post.Title}}</h1>
  </header>
</div>
<main id="main" class="column column--post">
  <article><div class="prose">{{.Post.HTML}}</div></article>
</main>
{{template "footer" .}}
</body>
</html>
