<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="masthead masthead--medium">
  {{template "header" .}}
  <header class="masthead-title">
    <p class="kicker">Error {{.Code}}</p>
    <h1>{{.Message}}</h1>
  </header>
</div>
<main id="main" class="column column--post">
  <p class="lede">The page you asked for is not here. It may have moved, or the link may be old.</p>
  <p><a class="back" href="/">Back to all posts →</a></p>
</main>
{{template "footer" .}}
</body>
</html>
