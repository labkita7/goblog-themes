<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="mx-auto w-full max-w-3xl px-6 pb-24 pt-24">
  <p class="inline-block border-2 border-foreground bg-destructive px-4 py-2 font-heading text-5xl text-white">{{.Code}}</p>
  <h1 class="mt-6 font-heading text-3xl">{{.Message}}</h1>
  <p class="mt-3 text-muted-foreground">The page you are looking for does not exist or has moved.</p>
  <a class="brutal-card mt-8 inline-block bg-primary px-5 py-2 font-heading text-sm uppercase text-primary-foreground" href="/">Back to the blog</a>
</main>
{{template "footer" .}}
</body>
</html>
