<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
{{template "headMeta" .}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<div class="layout">
  {{template "sidebar" .}}
  <main id="main" class="listing">
    <div class="notfound-card">
      <p class="listing-kicker">Error {{.Code}}</p>
      <h1 class="listing-title">{{.Message}}</h1>
      <p>The address may be out of date. <a href="/">Return to the recent posts</a>.</p>
    </div>
  </main>
</div>
{{template "footer" .}}
</body>
</html>
