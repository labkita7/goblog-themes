<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
{{template "headMeta" .}}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":{{.Site.Title}},"url":{{.Site.URL}}}</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<div class="layout">
  {{template "sidebar" .}}
  <main id="main" class="listing">
    <h1 class="listing-title">Recent posts</h1>
    <div class="cards{{if eq (setting "layout") "list"}} cards--list{{end}}">
      {{range .Posts}}{{template "entry" .}}{{else}}<p class="empty">No posts yet.</p>{{end}}
    </div>
    {{template "pager" .}}
  </main>
</div>
{{template "footer" .}}
</body>
</html>
