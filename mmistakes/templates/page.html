<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
{{template "headMeta" .}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<div class="layout{{if and (setting "show_toc") .TOC}} layout--toc{{end}}">
  {{template "sidebar" .}}
  <main id="main" class="post-main">
    <article class="post">
      <header class="post-head">
        <h1 class="post-title">{{.Post.Title}}</h1>
      </header>
      <div class="prose post-body">{{.Post.HTML}}</div>
    </article>
  </main>
  {{if and (setting "show_toc") .TOC}}
  <aside class="toc" aria-label="On this page">
    <p class="toc-title">On this page</p>
    <ol>
      {{range .TOC}}<li class="toc-l{{.Level}}"><a href="#{{.ID}}">{{.Text}}</a></li>{{end}}
    </ol>
  </aside>
  {{end}}
</div>
{{template "footer" .}}
</body>
</html>
