<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
{{template "headMeta" .}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<div class="layout">
  {{template "sidebar" .}}
  <main id="main" class="listing">
    <p class="listing-kicker">Contact</p>
    <h1 class="listing-title">Send a message</h1>
    <div class="form-card">
      {{if .Sent}}
      <p class="notice" role="status">Thank you. Your message was delivered.</p>
      {{else}}
      {{if .Message}}<p class="notice is-error" role="alert">{{.Message}}</p>{{end}}
      <form method="post" action="/contact" class="contact-form">
        <label class="field"><span>Name</span><input name="name" required maxlength="100" value="{{.Values.Name}}" autocomplete="name"></label>
        <label class="field"><span>Email</span><input name="email" type="email" required maxlength="200" value="{{.Values.Email}}" autocomplete="email"></label>
        <label class="field"><span>Subject</span><input name="subject" maxlength="150" value="{{.Values.Subject}}"></label>
        <label class="field"><span>Message</span><textarea name="message" rows="6" required minlength="10" maxlength="5000">{{.Values.Message}}</textarea></label>
        <label class="field"><span>{{.Question}} (spam check)</span><input name="captcha" required inputmode="numeric" autocomplete="off"></label>
        <input type="hidden" name="captcha_token" value="{{.Token}}">
        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn" type="submit">Send message</button>
      </form>
      {{end}}
    </div>
  </main>
</div>
{{template "footer" .}}
</body>
</html>
