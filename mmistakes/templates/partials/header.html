{{define "header"}}
<header class="masthead">
  <div class="masthead-inner">
    <a class="masthead-brand" href="/">{{.Site.Title}}</a>
    {{if .Nav.Items}}
    <nav aria-label="Main navigation" class="masthead-nav">
      <ul>
        {{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
      </ul>
    </nav>
    {{end}}
    <button type="button" class="masthead-toggle" data-theme-toggle aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
    </button>
  </div>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
