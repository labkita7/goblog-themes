<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
{{template "headMeta" .}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<div class="layout">
  {{template "sidebar" .}}
  <main id="main" class="listing">
    <p class="listing-kicker">Topic</p>
    <h1 class="listing-title">{{.Tag.Name}}</h1>
    <div class="cards{{if eq (setting "layout") "list"}} cards--list{{end}}">
      {{range .Posts}}{{template "entry" .}}{{else}}<p class="empty">No posts with this tag yet.</p>{{end}}
    </div>
    {{template "pager" .}}
  </main>
</div>
{{template "footer" .}}
</body>
</html>
