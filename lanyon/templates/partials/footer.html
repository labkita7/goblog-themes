{{define "footer"}}
<footer class="site-footer">
  <p class="site-footer-title">{{.Site.Title}}</p>
  <p>© {{.Site.Year}}</p>
  {{if .FooterNav.Items}}
  <nav aria-label="Footer navigation">
    <ul class="footer-nav">
      {{range .FooterNav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
    </ul>
  </nav>
  {{end}}
</footer>
{{end}}
