{{define "pager"}}
{{if or .PrevURL .NextURL}}
<nav class="big-pager" aria-label="Pagination">
  {{if .PrevURL}}<a class="big-btn" href="{{.PrevURL}}" rel="prev">Newer posts</a>{{else}}<span class="big-btn is-disabled" aria-disabled="true">Newer posts</span>{{end}}
  {{if .NextURL}}<a class="big-btn" href="{{.NextURL}}" rel="next">Older posts</a>{{else}}<span class="big-btn is-disabled" aria-disabled="true">Older posts</span>{{end}}
</nav>
{{end}}
{{end}}
