<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
{{template "headMeta" .}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main">
  <p class="kicker">Topic</p>
  <h1 class="roll-heading">{{.Tag.Name}}</h1>
  <div class="roll">
    {{range .Posts}}{{template "entry" .}}{{else}}<p>No posts with this tag yet.</p>{{end}}
  </div>
  {{template "pager" .}}
</main>
{{template "footer" .}}
</body>
</html>
