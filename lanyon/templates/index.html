<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
{{template "headMeta" .}}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":{{.Site.Title}},"url":{{.Site.URL}}}</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main">
  <h1 class="roll-heading">Posts</h1>
  <div class="roll">
    {{range .Posts}}{{template "entry" .}}{{else}}<p>No posts yet.</p>{{end}}
  </div>
  {{template "pager" .}}
</main>
{{template "footer" .}}
</body>
</html>
