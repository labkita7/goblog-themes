<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
{{template "headMeta" .}}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":{{.Site.Title}},"url":{{.Site.URL}}}</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="lh-main">
  <h1 class="lh-title">Reading list</h1>
  {{if .Site.Description}}<p class="lh-lede">{{.Site.Description}}</p>{{end}}
  <ol class="reads">
    {{range .Posts}}{{template "entry" .}}{{else}}<li class="empty">No posts yet.</li>{{end}}
  </ol>
  {{template "pager" .}}
</main>
{{template "footer" .}}
</body>
</html>
