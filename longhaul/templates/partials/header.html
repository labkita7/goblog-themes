{{define "header"}}
<header class="lh-top">
  <a class="lh-brand" href="/">{{.Site.Title}}</a>
  {{if .Nav.Items}}
  <nav aria-label="Main navigation">
    <ul class="lh-nav">
      {{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
    </ul>
  </nav>
  {{end}}
  <button type="button" class="lh-lamp" data-theme-toggle><span class="when-light">Dim the lights</span><span class="when-dark">Lamp on</span></button>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
