{{define "footer"}}
<footer class="colophon">
  <p>{{.Site.Title}}, {{.Site.Year}}</p>
  {{if .FooterNav.Items}}
  <nav aria-label="Footer navigation">
    <ul class="footer-nav">
      {{range .FooterNav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
    </ul>
  </nav>
  {{end}}
  <p class="feeds"><a href="/rss.xml">RSS</a> <a href="/atom.xml">Atom</a> <a href="/feed.json">JSON</a></p>
</footer>
{{end}}
