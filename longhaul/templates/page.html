<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
{{template "headMeta" .}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="lh-post{{if and (setting "show_toc") .TOC}} has-toc{{end}}{{if eq (setting "column_width") "wide"}} col-wide{{end}}">
  <header class="lh-post-head">
    <h1 class="lh-post-title">{{.Post.Title}}</h1>
  </header>
  {{template "toc" .}}
  <article class="prose lh-body">{{.Post.HTML}}</article>
</main>
{{template "footer" .}}
</body>
</html>
