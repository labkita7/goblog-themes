<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
{{template "headMeta" .}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="lh-main">
  <p class="lh-kicker">Tagged</p>
  <h1 class="lh-title">{{.Tag.Name}}</h1>
  <ol class="reads">
    {{range .Posts}}{{template "entry" .}}{{else}}<li class="empty">No posts with this tag yet.</li>{{end}}
  </ol>
  {{template "pager" .}}
</main>
{{template "footer" .}}
</body>
</html>
