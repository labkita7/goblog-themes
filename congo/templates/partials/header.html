{{define "header"}}
<header class="cg-header">
  <div class="cg-header-inner">
    <a class="cg-brand" href="/">{{.Site.Title}}</a>
    {{if .Nav.Items}}
    <nav class="cg-nav" aria-label="Main navigation">
      <ul>{{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}</ul>
    </nav>
    <details class="cg-menu">
      <summary>Menu</summary>
      <nav aria-label="Main navigation (small screens)">
        <ul>{{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}</ul>
      </nav>
    </details>
    {{end}}
    <button type="button" class="cg-theme" data-theme-toggle aria-label="Toggle dark mode">
      <svg class="cg-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.4M12 18.8v2.4M5.1 5.1l1.7 1.7M17.2 17.2l1.7 1.7M2.8 12h2.4M18.8 12h2.4M5.1 18.9l1.7-1.7M17.2 6.8l1.7-1.7"/></svg>
      <svg class="cg-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
