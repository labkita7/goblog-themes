<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
<title>{{.Head.Title}}</title>
<meta name="description" content="{{.Head.Description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{.Head.Title}}">
<meta property="og:description" content="{{.Head.Description}}">
</head>
<body class="cg-page">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="cg-main cg-narrow">
  <header class="cg-post-head">
    <h1>Contact</h1>
    <p class="cg-meta">Send a message to {{.Site.Title}}.</p>
  </header>
  <section class="cg-panel cg-after-head">
    {{if .Sent}}
    <p class="cg-notice" role="status">Thank you — your message was delivered.</p>
    {{else}}
    {{if .Message}}<p class="cg-notice is-error" role="alert">{{.Message}}</p>{{end}}
    <form class="cg-form" method="post" action="/contact">
      <label for="cg-name">Name
        <input id="cg-name" name="name" required maxlength="100" autocomplete="name" value="{{.Values.Name}}">
      </label>
      <label for="cg-email">Email
        <input id="cg-email" name="email" type="email" required maxlength="200" autocomplete="email" value="{{.Values.Email}}">
      </label>
      <label for="cg-subject">Subject
        <input id="cg-subject" name="subject" maxlength="150" value="{{.Values.Subject}}">
      </label>
      <label for="cg-message">Message
        <textarea id="cg-message" name="message" rows="6" required minlength="10" maxlength="5000">{{.Values.Message}}</textarea>
      </label>
      <label for="cg-captcha">{{.Question}}
        <small>Spam check</small>
        <input id="cg-captcha" name="captcha" required inputmode="numeric" autocomplete="off">
      </label>
      <input type="hidden" name="captcha_token" value="{{.Token}}">
      <div class="cg-hp" aria-hidden="true">
        <label>Website <input name="website" tabindex="-1" autocomplete="off"></label>
      </div>
      <button type="submit">Send message</button>
    </form>
    {{end}}
  </section>
</main>
{{template "footer" .}}
</body>
</html>
