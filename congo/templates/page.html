<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headPage" .}}
<body class="cg-page">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="cg-main cg-narrow">
  <article>
    <header class="cg-post-head"><h1>{{.Post.Title}}</h1></header>
    <div class="prose cg-body">{{.Post.HTML}}</div>
  </article>
</main>
{{template "footer" .}}
</body>
</html>
