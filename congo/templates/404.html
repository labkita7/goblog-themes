<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body class="cg-page">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="cg-main cg-narrow">
  <section class="cg-error">
    <div class="cg-avatar cg-avatar-lg" aria-hidden="true">{{.Code}}</div>
    <h1>{{.Message}}</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <a class="cg-button" href="/">Back to the blog</a>
  </section>
</main>
{{template "footer" .}}
</body>
</html>
