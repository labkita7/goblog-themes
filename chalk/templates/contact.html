<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
<title>{{.Head.Title}}</title>
<meta name="description" content="{{.Head.Description}}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="ch-layout">
  {{template "sidebar" .}}
  <main id="main" class="ch-main">
    <header class="ch-head">
      <p class="ch-kicker">Contact</p>
      <h1>Send a message</h1>
    </header>
    {{if .Sent}}
    <p class="ch-notice" role="status">Thanks. Your message was sent.</p>
    {{else}}
    {{if .Message}}<p class="ch-notice ch-notice-error" role="alert">{{.Message}}</p>{{end}}
    <form class="ch-form" method="post" action="/contact">
      <label class="ch-field"><span>Name</span><input name="name" required maxlength="100" autocomplete="name" value="{{.Values.Name}}"></label>
      <label class="ch-field"><span>Email</span><input name="email" type="email" required maxlength="200" autocomplete="email" value="{{.Values.Email}}"></label>
      <label class="ch-field"><span>Subject</span><input name="subject" maxlength="150" value="{{.Values.Subject}}"></label>
      <label class="ch-field"><span>Message</span><textarea name="message" rows="6" required minlength="10" maxlength="5000">{{.Values.Message}}</textarea></label>
      <label class="ch-field"><span>{{.Question}}</span><input name="captcha" required inputmode="numeric" autocomplete="off"></label>
      <input type="hidden" name="captcha_token" value="{{.Token}}">
      <div class="ch-honey" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
      <button class="ch-submit" type="submit">Send message</button>
    </form>
    {{end}}
    {{template "footer" .}}
  </main>
</div>
</body>
</html>
