<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headPage" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="ch-layout">
  {{template "sidebarPost" .}}
  <main id="main" class="ch-main">
    <article class="ch-article">
      <h1>{{.Post.Title}}</h1>
      <span class="ch-article-rule" aria-hidden="true"></span>
      <div class="prose ch-body">{{.Post.HTML}}</div>
    </article>
    {{template "footer" .}}
  </main>
</div>
</body>
</html>
