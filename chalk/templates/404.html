<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="ch-layout">
  {{template "sidebar" .}}
  <main id="main" class="ch-main ch-404">
    <p class="ch-404-code" aria-hidden="true">{{.Code}}</p>
    <h1>{{.Message}}</h1>
    <p class="ch-entry-excerpt">The page you are looking for does not exist or has moved.</p>
    <p class="ch-pager"><a href="/">Back to the front page</a></p>
    {{template "footer" .}}
  </main>
</div>
</body>
</html>
