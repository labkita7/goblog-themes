<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="content not-found">
  <p class="code">{{.Code}}</p>
  <h1 class="post-heading">{{.Message}}</h1>
  <p>The page you requested could not be found. <a href="/">Return to the posts</a>.</p>
</main>
{{template "footer" .}}
</body>
</html>
