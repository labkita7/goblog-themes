{{define "footer"}}
<footer class="site-foot">
  <div class="site-foot-inner">
    <div class="foot-col">
      <p class="foot-title">{{.Site.Title}}</p>
      <p class="foot-note">© {{.Site.Year}}</p>
    </div>
    <div class="foot-col">
      <p class="foot-desc">{{.Site.Description}}</p>
    </div>
    <div class="foot-col">
      <ul class="foot-links">
        {{range .FooterNav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
        <li><a href="/rss.xml">RSS</a></li>
        <li><a href="/atom.xml">Atom</a></li>
        <li><a href="/feed.json">JSON Feed</a></li>
      </ul>
    </div>
  </div>
</footer>
{{end}}
