<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headArchive" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="content">
  <h1 class="section-title">{{if .Year}}Posts from {{.Year}}{{else}}Archive{{end}}</h1>
  <ul class="year-tabs" aria-label="Years">
    {{range .Site.ArchiveYears}}<li><a href="{{.URL}}">{{.Year}} <span>{{.Count}}</span></a></li>{{end}}
  </ul>
  {{template "postlist" .}}
  {{template "pager" .}}
</main>
{{template "footer" .}}
</body>
</html>
