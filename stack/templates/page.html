<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headPage" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="st-main">
  <article class="st-card st-article">
    <div class="st-article-body">
      <header class="st-article-head">
        <h1>{{.Post.Title}}</h1>
      </header>
      <div class="prose st-prose">{{.Post.HTML}}</div>
    </div>
  </article>
</main>
{{template "footer" .}}
</body>
</html>
