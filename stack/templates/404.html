<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="st-main">
  <section class="st-card st-error">
    <p class="st-error-code" aria-hidden="true">{{.Code}}</p>
    <h1>{{.Message}}</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <a class="st-button" href="/">Back to the blog</a>
  </section>
</main>
{{template "footer" .}}
</body>
</html>
