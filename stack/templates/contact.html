<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
<title>{{.Head.Title}}</title>
<meta name="description" content="{{.Head.Description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{.Head.Title}}">
<meta property="og:description" content="{{.Head.Description}}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="st-main">
  <h1 class="st-heading">Contact<small>Send a note to {{.Site.Title}}.</small></h1>
  {{if .Sent}}
  <section class="st-card">
    <p class="st-notice" role="status">Thank you — your message was delivered.</p>
  </section>
  {{else}}
  <section class="st-card">
    {{if .Message}}<p class="st-notice is-error" role="alert">{{.Message}}</p>{{end}}
    <form class="st-form" method="post" action="/contact">
      <div class="st-form-grid">
        <label for="st-name">Name
          <input id="st-name" name="name" required maxlength="100" autocomplete="name" value="{{.Values.Name}}">
        </label>
        <label for="st-email">Email
          <input id="st-email" name="email" type="email" required maxlength="200" autocomplete="email" value="{{.Values.Email}}">
        </label>
        <label class="st-wide" for="st-subject">Subject
          <input id="st-subject" name="subject" maxlength="150" value="{{.Values.Subject}}">
        </label>
        <label class="st-wide" for="st-message">Message
          <textarea id="st-message" name="message" rows="6" required minlength="10" maxlength="5000">{{.Values.Message}}</textarea>
        </label>
        <label class="st-wide" for="st-captcha">{{.Question}}
          <small>Spam check</small>
          <input id="st-captcha" name="captcha" required inputmode="numeric" autocomplete="off">
        </label>
      </div>
      <input type="hidden" name="captcha_token" value="{{.Token}}">
      <div class="st-hp" aria-hidden="true">
        <label>Website <input name="website" tabindex="-1" autocomplete="off"></label>
      </div>
      <button type="submit">Send message</button>
    </form>
  </section>
  {{end}}
</main>
{{template "footer" .}}
</body>
</html>
