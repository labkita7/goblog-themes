<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
{{template "headMeta" .}}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":{{.Site.Title}},"url":{{.Site.URL}}}</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="hyde-shell{{if eq (setting "sidebar_side") "right"}} is-right{{end}}">
{{template "header" .}}
<div class="content">
<main id="main">
  <h1 class="page-heading">Posts</h1>
  {{range .Posts}}{{template "entry" .}}{{else}}<p>No posts yet.</p>{{end}}
  {{template "pager" .}}
</main>
{{template "footer" .}}
</div>
</div>
</body>
</html>
