{{define "headCore"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="goblog">
<script>
(function(){var s=null;try{s=localStorage.getItem("goblog-theme")}catch(e){}
var d=s?s==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
document.documentElement.classList.toggle("dark",d)})();
</script>
<meta property="og:site_name" content="{{.Site.Title}}">
<link rel="alternate" type="application/rss+xml" title="{{.Site.Title}} — RSS" href="/rss.xml">
<link rel="alternate" type="application/atom+xml" title="{{.Site.Title}} — Atom" href="/atom.xml">
<link rel="alternate" type="application/json" title="{{.Site.Title}} — JSON Feed" href="/feed.json">
<link rel="stylesheet" href="{{asset "theme.css"}}">
<style>
:root{--primary:{{setting "accent"}};}
.dark{--primary:{{setting "accent"}};}
</style>
{{end}}

{{define "headMeta"}}
<title>{{.Head.Title}}</title>
<meta name="description" content="{{.Head.Description}}">
{{if .Head.Canonical}}<link rel="canonical" href="{{.Head.Canonical}}">{{end}}
{{if .Head.Noindex}}<meta name="robots" content="noindex">{{end}}
<meta property="og:type" content="{{if .Head.OGType}}{{.Head.OGType}}{{else}}website{{end}}">
<meta property="og:title" content="{{.Head.Title}}">
<meta property="og:description" content="{{.Head.Description}}">
{{if .Head.Canonical}}<meta property="og:url" content="{{.Head.Canonical}}">{{end}}
{{if .Head.OGImage}}<meta property="og:image" content="{{.Head.OGImage}}">{{end}}
<meta name="twitter:card" content="summary">
{{end}}
