<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
{{template "headMeta" .}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="hyde-shell{{if eq (setting "sidebar_side") "right"}} is-right{{end}}">
{{template "header" .}}
<div class="content">
<main id="main">
  <p class="eyebrow">Tag</p>
  <h1 class="page-heading">{{.Tag.Name}}</h1>
  {{range .Posts}}{{template "entry" .}}{{else}}<p>No posts with this tag yet.</p>{{end}}
  {{template "pager" .}}
</main>
{{template "footer" .}}
</div>
</div>
</body>
</html>
