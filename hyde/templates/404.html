<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
{{template "headMeta" .}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="hyde-shell{{if eq (setting "sidebar_side") "right"}} is-right{{end}}">
{{template "header" .}}
<div class="content">
<main id="main" class="not-found">
  <p class="eyebrow">Error {{.Code}}</p>
  <h1 class="page-heading">{{.Message}}</h1>
  <p>The page you asked for is not here. <a href="/">Go to the front page</a>.</p>
</main>
{{template "footer" .}}
</div>
</div>
</body>
</html>
