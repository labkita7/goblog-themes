{{define "header"}}
<header class="gw-masthead">
  <p class="gw-dateline">{{.Site.Description}}</p>
  <p class="gw-title"><a href="/">{{.Site.Title}}</a></p>
  <nav class="gw-nav" aria-label="Main navigation">
    <ul>
      {{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
      <li>
        <button type="button" class="gw-toggle" data-theme-toggle aria-label="Toggle dark mode"><span aria-hidden="true">¶</span></button>
      </li>
    </ul>
  </nav>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
