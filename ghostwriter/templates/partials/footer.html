{{define "footer"}}
<footer class="gw-colophon">
  <p class="gw-colophon-mark" aria-hidden="true">❦</p>
  <p>© {{.Site.Year}} {{.Site.Title}}</p>
  {{if .FooterNav.Items}}
  <nav aria-label="Footer navigation">
    <ul>{{range .FooterNav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}</ul>
  </nav>
  {{end}}
  <p class="gw-feeds"><a href="/rss.xml">RSS</a> <a href="/atom.xml">Atom</a> <a href="/feed.json">JSON</a></p>
</footer>
{{end}}
