<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headPage" .}}
<body class="gw">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="gw-main">
  <article class="gw-chapter">
    <header class="gw-chapter-head">
      <h1>{{.Post.Title}}</h1>
    </header>
    <div class="prose gw-prose{{if setting "show_dropcap"}} has-dropcap{{end}}">{{.Post.HTML}}</div>
  </article>
</main>
{{template "footer" .}}
</body>
</html>
