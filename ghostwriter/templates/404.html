<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body class="gw">
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="gw-main gw-missing">
  <p class="gw-code">{{.Code}}</p>
  <h1 class="gw-h1">A leaf torn from the book</h1>
  <p class="gw-dek">{{.Message}}. The page you seek is not in this edition.</p>
  <p><a class="gw-link" href="/">Return to the contents</a></p>
</main>
{{template "footer" .}}
</body>
</html>
