{{define "header"}}
<header class="masthead">
  <div class="wrap masthead-top">
    {{if .Nav.Items}}
    <nav class="top-nav" aria-label="Main navigation">
      <ul>
        {{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
      </ul>
    </nav>
    {{end}}
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode"><span class="when-light" aria-hidden="true">☾ Dark</span><span class="when-dark" aria-hidden="true">☼ Light</span></button>
  </div>
  <div class="wrap masthead-title">
    <a href="/">{{.Site.Title}}</a>
  </div>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
