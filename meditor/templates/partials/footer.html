{{define "footer"}}
<footer class="colophon">
  <div class="wrap colophon-inner">
    <p class="colophon-title">{{.Site.Title}}</p>
    <p>© {{.Site.Year}}</p>
    {{if .FooterNav.Items}}
    <nav aria-label="Footer navigation">
      <ul>{{range .FooterNav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}</ul>
    </nav>
    {{end}}
    <ul class="feeds" aria-label="Feeds">
      <li><a href="/rss.xml">RSS</a></li>
      <li><a href="/atom.xml">Atom</a></li>
      <li><a href="/feed.json">JSON</a></li>
    </ul>
  </div>
</footer>
{{end}}
