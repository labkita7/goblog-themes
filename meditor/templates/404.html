<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="wrap error-page">
  <p class="error-code" aria-hidden="true">{{.Code}}</p>
  <h1 class="error-title">{{.Message}}</h1>
  <p>This page is not in the archive. It may have moved, or the link is wrong.</p>
  <a class="error-link" href="/">Return to the front page</a>
</main>
{{template "footer" .}}
</body>
</html>
