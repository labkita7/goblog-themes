<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headTag" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="frame">
{{template "header" .}}
<main id="main" class="page">
  <header class="page-head">
    <p class="page-kicker">Tag</p>
    <h1>{{.Tag.Name}}</h1>
    <p class="page-note">{{len .Posts}} {{if eq (len .Posts) 1}}entry{{else}}entries{{end}} filed under this tag.</p>
  </header>
  {{template "ledger" .}}
  {{template "pager" .}}
</main>
{{template "footer" .}}
</div>
</body>
</html>
