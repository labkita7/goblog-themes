{{define "header"}}
<header class="masthead">
  <a class="brand" href="/">{{.Site.Title}}</a>
  <nav class="menu" aria-label="Main navigation">
    <ul>{{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}</ul>
  </nav>
  <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><rect x="2" y="2" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2h4v12H8z" fill="currentColor"/></svg>
  </button>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
