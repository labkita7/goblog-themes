<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headPage" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="frame">
{{template "header" .}}
<main id="main" class="page">
  <div class="column">
    <article>
      <h1 class="article-title">{{.Post.Title}}</h1>
      <div class="prose entry-body">{{.Post.HTML}}</div>
    </article>
  </div>
</main>
{{template "footer" .}}
</div>
</body>
</html>
