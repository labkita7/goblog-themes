<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headArchive" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="frame">
{{template "header" .}}
<main id="main" class="page">
  <header class="page-head">
    <p class="page-kicker">Archive</p>
    <h1>{{if .Year}}{{.Year}}{{else}}All entries{{end}}</h1>
    <nav class="years" aria-label="Filter by year">
      <a href="/archive/"{{if not .Year}} aria-current="page"{{end}}>All</a>
      {{range .Site.ArchiveYears}}<a href="{{.URL}}"{{if eq .Year $.Year}} aria-current="page"{{end}}>{{.Year}} ({{.Count}})</a>{{end}}
    </nav>
  </header>
  {{template "ledger" .}}
  {{template "pager" .}}
</main>
{{template "footer" .}}
</div>
</body>
</html>
