<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="frame">
{{template "header" .}}
<main id="main" class="page">
  <div class="column not-found">
    <p class="code">{{.Code}}</p>
    <h1>{{.Message}}</h1>
    <p>No entry exists at this address. It may have moved or been removed.</p>
    <p><a href="/">Back to the index</a></p>
  </div>
</main>
{{template "footer" .}}
</div>
</body>
</html>
