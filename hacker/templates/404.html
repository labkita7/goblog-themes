<!doctype html>
<html lang="{{.Site.Language}}">
{{template "headError" .}}
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="page">
  <section class="frame error-frame">
    <p class="frame-label">ERR</p>
    <p class="error-code" aria-hidden="true">{{.Code}}</p>
    <h1 class="cmd-title"><span class="warn">{{.Message}}</span></h1>
    <p class="status">cat: requested path: No such file or directory</p>
    <p><a class="cmd-link" href="/">cd /</a></p>
  </section>
</main>
{{template "footer" .}}
</body>
</html>
