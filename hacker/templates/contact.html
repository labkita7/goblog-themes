<!doctype html>
<html lang="{{.Site.Language}}">
<head>
{{template "headCore" .}}
<title>{{.Head.Title}}</title>
<meta name="description" content="{{.Head.Description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{.Head.Title}}">
<meta property="og:description" content="{{.Head.Description}}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{template "header" .}}
<main id="main" class="page">
  <section class="frame">
    <p class="frame-label">contact</p>
    <h1 class="cmd-title">./send_message --interactive</h1>
    {{if .Sent}}
    <p class="notice" role="status">message queued. delivered.</p>
    {{else}}
    {{if .Message}}<p class="notice notice-error" role="alert">error: {{.Message}}</p>{{end}}
    <form method="post" action="/contact" class="form">
      <label for="c-name"><span class="field-key">name</span></label>
      <input id="c-name" name="name" required maxlength="100" value="{{.Values.Name}}" autocomplete="name">
      <label for="c-email"><span class="field-key">email</span></label>
      <input id="c-email" name="email" type="email" required maxlength="200" value="{{.Values.Email}}" autocomplete="email">
      <label for="c-subject"><span class="field-key">subject</span></label>
      <input id="c-subject" name="subject" maxlength="150" value="{{.Values.Subject}}">
      <label for="c-message"><span class="field-key">message</span></label>
      <textarea id="c-message" name="message" rows="6" required minlength="10" maxlength="5000">{{.Values.Message}}</textarea>
      <label for="c-captcha"><span class="field-key">{{.Question}}</span> <span class="status">(spam check)</span></label>
      <input id="c-captcha" name="captcha" required inputmode="numeric" autocomplete="off">
      <input type="hidden" name="captcha_token" value="{{.Token}}">
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="cmd-link submit" type="submit">run send</button>
    </form>
    {{end}}
  </section>
</main>
{{template "footer" .}}
</body>
</html>
