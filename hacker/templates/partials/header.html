{{define "header"}}
<header class="topbar">
  <a class="site" href="/">{{.Site.Title}}</a>
  {{if .Nav.Items}}
  <nav aria-label="Main navigation">
    <ul class="nav">
      {{range .Nav.Items}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
    </ul>
  </nav>
  {{end}}
  <button type="button" data-theme-toggle class="power" aria-label="Toggle dark mode">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
  </button>
</header>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-theme-toggle]");if(!b)return;
var d=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("goblog-theme",d?"dark":"light")}catch(_){}});
</script>
{{end}}
